
company: B
reporting_currency: USD

tree_file: data/B/taxonomy_B.csv

fx:
  file: data/B/fx_rates_usd.csv
  month_col: month
  currency_col: currency
  rate_col: units_per_usd

labels:
  file: data/B/seed_labels.csv
  id_col: line_id
  level_cols: [category_l1, category_l2, category_l3]

sources:
  - name: ap
    file: data/B/invoice_lines.csv
    id_col: line_id

    # Assumption: line_amount is treated as net.
    # Confirm/document this if the task brief does not specify it.
    amount_is_gross: false

    columns:
      amount: line_amount
      date: posting_date
      vendor_id: vendor_id
      item_code: material_number
      currency: currency
      rate: currency_rate

    vendor_scope: [source_system, region]

    desc_cols:
      - line_description

    context_cols:
      - gl_account
      - gl_account_description
      - supplier_type
      - document_type

    date_formats:
      - "%Y-%m-%d"
      - "%d/%m/%Y"
      - "%m/%d/%Y"
      - "%d.%m.%Y"
